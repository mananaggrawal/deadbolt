# Nightly encrypted database backup, kept for 30 days as a workflow artifact.
# Needs two repository secrets: BACKUP_DATABASE_URL (Neon's direct, unpooled connection string)
# and BACKUP_PASSPHRASE. Restoring is in DEPLOY.md ("Restore a backup").
name: backup

on:
  schedule:
    - cron: "0 21 * * *"      # 02:30 in India
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 18 (dumps Postgres 18 and older)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18 >/dev/null
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::Set BACKUP_DATABASE_URL and BACKUP_PASSPHRASE (see DEPLOY.md)"; exit 1; fi
          stamp=$(date -u +%Y-%m-%dT%H%M)
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE > "deadbolt-$stamp.dump.enc"
          ls -la deadbolt-*.dump.enc
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: deadbolt-db-${{ env.STAMP }}
          path: deadbolt-*.dump.enc
          retention-days: 30
          compression-level: 0
