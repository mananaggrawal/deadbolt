#cloud-config
# Paste this into "User data" when creating the DigitalOcean Droplet (Advanced options).
# It installs Docker, creates the "deploy" user that GitHub Actions logs in as (with the same
# SSH keys you chose for the Droplet), turns on the firewall, automatic security updates,
# a swap file, and the nightly backup and upkeep jobs.

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - rsync
  - ufw
  - fail2ban
  - unattended-upgrades
  - rclone
  - openssl

write_files:
  - path: /etc/ssh/sshd_config.d/90-mystery-rooms.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "5" } }
  - path: /etc/cron.d/mystery-rooms
    content: |
      # 02:30 and 02:45 in India (UTC+5:30)
      0 21 * * * deploy /opt/mystery-rooms/backup.sh >> /opt/mystery-rooms/backup.log 2>&1
      15 21 * * * deploy cd /opt/mystery-rooms && docker compose exec -T app node src/maintenance.js >> /opt/mystery-rooms/maintenance.log 2>&1

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - id deploy || useradd -m -s /bin/bash deploy
  - usermod -aG docker deploy
  - mkdir -p /home/deploy/.ssh && cp /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - chown -R deploy:deploy /home/deploy/.ssh && chmod 700 /home/deploy/.ssh && chmod 600 /home/deploy/.ssh/authorized_keys
  - mkdir -p /opt/mystery-rooms && chown deploy:deploy /opt/mystery-rooms
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - ufw default deny incoming && ufw default allow outgoing && ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
  - systemctl enable --now fail2ban
  - systemctl restart ssh || systemctl restart sshd
  - systemctl restart docker
